<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecanismo — Lights Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #12100D;
    --panel: #1D1812;
    --panel-edge: #2A2118;
    --stone-off: #34291F;
    --stone-off-hover: #443627;
    --glow-on: #F2A83B;
    --glow-on-soft: #F2A83B55;
    --success: #7CB88F;
    --success-soft: #7CB88F33;
    --text-warm: #EFE6D8;
    --text-dim: #A9998757;
    --text-dim2: #a99987;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, #2a2118 0%, transparent 60%);
    color: var(--text-warm);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .rig {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 30px);
    letter-spacing: 0.03em;
    margin: 0;
    text-align: center;
    color: var(--text-warm);
  }

  .subtitle {
    margin-top: -14px;
    font-size: 13px;
    color: var(--text-dim2);
    text-align: center;
    line-height: 1.5;
    max-width: 320px;
  }

  .door {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 22px;
    width: 100%;
    box-shadow: 0 0 0 6px var(--void), inset 0 1px 0 #ffffff08;
    transition: box-shadow 0.6s ease;
  }

  .door.solved {
    box-shadow: 0 0 0 6px var(--void), 0 0 40px var(--success-soft), inset 0 1px 0 #ffffff08;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .cell {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1px solid #00000040;
    background: var(--stone-off);
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, box-shadow 0.25s ease, transform 0.1s ease;
  }

  .cell:hover { background: var(--stone-off-hover); }
  .cell:active { transform: scale(0.94); }

  .cell.on {
    background: var(--glow-on);
    box-shadow: 0 0 14px var(--glow-on-soft), inset 0 0 6px #ffffff40;
    border-color: #00000010;
  }

  .door.solved .cell {
    background: var(--success) !important;
    box-shadow: 0 0 14px var(--success-soft), inset 0 0 6px #ffffff40 !important;
    cursor: default;
  }

  .hud {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim2);
    letter-spacing: 0.02em;
  }

  .hud .value {
    color: var(--text-warm);
    font-weight: 500;
  }

  .status {
    min-height: 20px;
    font-size: 13px;
    color: var(--success);
    letter-spacing: 0.03em;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .status.show { opacity: 1; }

  .controls {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  button.action {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
    background: transparent;
    color: var(--text-warm);
    border: 1px solid var(--panel-edge);
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  button.action:hover {
    border-color: var(--glow-on);
    background: #ffffff06;
  }

  .diff-row {
    display: flex;
    gap: 6px;
  }

  .diff-row button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim2);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .diff-row button.selected {
    color: var(--glow-on);
    border-color: var(--glow-on);
  }

  .door-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    background: #000000aa;
    transition: opacity 0.3s ease;
    z-index: 50;
  }

  .door-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .door-leaf {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background: linear-gradient(180deg, var(--stone-off) 0%, #201810 100%);
    border: 1px solid var(--panel-edge);
    box-shadow: 0 0 30px #000000aa;
    transition: transform 1s cubic-bezier(.6,0,.25,1);
  }

  .door-leaf.left { left: 0; transform-origin: left; }
  .door-leaf.right { right: 0; transform-origin: right; }

  .door-overlay.active .door-leaf.left { transform: translateX(-100%); }
  .door-overlay.active .door-leaf.right { transform: translateX(100%); }

  .door-light {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 40% 60% at 50% 50%, var(--success-soft) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 1s ease 0.4s;
  }

  .door-overlay.active .door-light { opacity: 1; }

  .door-message {
    position: relative;
    z-index: 2;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease 0.9s, transform 0.6s ease 0.9s;
  }

  .door-overlay.active .door-message { opacity: 1; transform: translateY(0); }

  .door-message h2 {
    font-family: 'Cinzel', serif;
    color: var(--text-warm);
    letter-spacing: 0.04em;
    font-size: 22px;
    margin: 0 0 18px;
  }

  .door-message button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: transparent;
    color: var(--text-warm);
    border: 1px solid var(--success);
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
  }

  .door-message button:hover { background: var(--success-soft); }
</style>
</head>
<body>

<div class="rig">
  <h1>O Mecanismo</h1>
  <p class="subtitle">Apague todas as luzes para destravar a porta. Cada toque acende ou apaga a peça e suas vizinhas diretas.</p>

  <div class="diff-row" id="diffRow">
    <button data-scramble="10">fácil</button>
    <button data-scramble="20" class="selected">médio</button>
    <button data-scramble="35">difícil</button>
  </div>

  <div class="door" id="door">
    <div class="grid" id="grid"></div>
  </div>

  <div class="status" id="status">porta destravada</div>

  <div class="hud">
    <span>jogadas: <span class="value" id="moves">0</span></span>
    <span>mínimo estimado: <span class="value" id="minMoves">—</span></span>
  </div>

  <div class="controls">
    <button class="action" id="resetBtn">reiniciar puzzle</button>
    <button class="action" id="newBtn">novo puzzle</button>
  </div>
</div>

<div class="door-overlay" id="doorOverlay">
  <div class="door-leaf left"></div>
  <div class="door-leaf right"></div>
  <div class="door-light"></div>
  <div class="door-message">
    <h2>A porta se abre</h2>
    <button id="continueBtn">fechar</button>
  </div>
</div>

<script>
  const SIZE = 5;
  let board = [];
  let solved = false;
  let moveCount = 0;
  let scrambleMoves = 20;
  let currentSeedMoves = 0;

  const gridEl = document.getElementById('grid');
  const doorEl = document.getElementById('door');
  const statusEl = document.getElementById('status');
  const movesEl = document.getElementById('moves');
  const minMovesEl = document.getElementById('minMoves');
  const diffRow = document.getElementById('diffRow');

  function makeEmptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
  }

  function toggle(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
    board[r][c] = !board[r][c];
  }

  function applyMove(r, c, countMove) {
    toggle(r, c);
    toggle(r - 1, c);
    toggle(r + 1, c);
    toggle(r, c - 1);
    toggle(r, c + 1);
    if (countMove) {
      moveCount++;
      movesEl.textContent = moveCount;
    }
  }

  function generatePuzzle(scrambles) {
    board = makeEmptyBoard();
    // aplica cliques aleatórios a partir do estado resolvido, garantindo solução
    const used = new Set();
    let applied = 0;
    let guard = 0;
    while (applied < scrambles && guard < scrambles * 10) {
      guard++;
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      applyMove(r, c, false);
      applied++;
    }
    currentSeedMoves = scrambles;
    minMovesEl.textContent = '≤ ' + scrambles;
    moveCount = 0;
    movesEl.textContent = 0;
    solved = false;
    document.getElementById('doorOverlay').classList.remove('active');
    render();
  }

  function isSolved() {
    return board.every(row => row.every(cell => !cell));
  }

  function render() {
    gridEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const btn = document.createElement('button');
        btn.className = 'cell' + (board[r][c] ? ' on' : '');
        btn.setAttribute('aria-label', `célula ${r},${c}`);
        btn.addEventListener('click', () => onCellClick(r, c));
        gridEl.appendChild(btn);
      }
    }
    doorEl.classList.toggle('solved', solved);
    statusEl.classList.toggle('show', solved);
  }

  function onCellClick(r, c) {
    if (solved) return;
    applyMove(r, c, true);
    if (isSolved()) {
      solved = true;
      document.getElementById('doorOverlay').classList.add('active');
    }
    render();
  }

  document.getElementById('continueBtn').addEventListener('click', () => {
    document.getElementById('doorOverlay').classList.remove('active');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    generatePuzzle(currentSeedMoves);
  });

  document.getElementById('newBtn').addEventListener('click', () => {
    generatePuzzle(scrambleMoves);
  });

  diffRow.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...diffRow.children].forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    scrambleMoves = parseInt(btn.dataset.scramble, 10);
    generatePuzzle(scrambleMoves);
  });

  generatePuzzle(scrambleMoves);
</script>

</body>
</html>
